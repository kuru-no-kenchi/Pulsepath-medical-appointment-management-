name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Backend integration tests (unchanged, own PostgreSQL database)
  # ---------------------------------------------------------------
  backend-test:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.YOU_INTEGRATION_TEST_DB_PASSWORD }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: ${{ vars.YOUR_BACKEND_DIRECTORY }}

    env:
      APP_NAME: MedApp
      TEST_DB_URL: jdbc:postgresql://localhost:5432/medapp_test_db
      TEST_DB_USERNAME: postgres
      TEST_DB_PASSWORD: postgres
      TEST_JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
      TEST_JWT_EXPIRATION: 900000
      TEST_JWT_REFRESH_EXPIRATION: 604800000
      NEXT_PUBLIC_API_URL: http://localhost:8080

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "22"
          cache: maven

      - name: Create integration test database
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d postgres \
            -c "CREATE DATABASE medapp_test_db;"

      - name: Run backend integration tests
        run: ./mvnw -Dtest=ApplicationWorkFlowIntegrationTest test

  # ---------------------------------------------------------------
  # Frontend build + Playwright E2E (own PostgreSQL database)
  # ---------------------------------------------------------------
  e2e:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_NAME: MedApp
      E2E_DB_URL: jdbc:postgresql://localhost:5432/medapp_e2e_db
      E2E_DB_USERNAME: postgres
      E2E_DB_PASSWORD: postgres
      E2E_JWT_SECRET: ${{ secrets.E2E_JWT_SECRET }}
      E2E_JWT_EXPIRATION: 900000
      E2E_JWT_REFRESH_EXPIRATION: 604800000
      NEXT_PUBLIC_API_URL: http://localhost:8080
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_DOCTOR_EMAIL: ${{ secrets.E2E_DOCTOR_EMAIL }}
      E2E_DOCTOR_PASSWORD: ${{ secrets.E2E_DOCTOR_PASSWORD }}
      E2E_ASSISTANT_EMAIL: ${{ secrets.E2E_ASSISTANT_EMAIL }}
      E2E_ASSISTANT_PASSWORD: ${{ secrets.E2E_ASSISTANT_PASSWORD }}
      E2E_PATIENT_EMAIL: ${{ secrets.E2E_PATIENT_EMAIL }}
      E2E_PATIENT_PASSWORD: ${{ secrets.E2E_PATIENT_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create E2E database
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d postgres \
            -c "CREATE DATABASE medapp_e2e_db;"

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: "22"
          cache: maven

      - name: Start backend server
        working-directory: ${{ vars.YOUR_BACKEND_DIRECTORY }}
        shell: bash
        run: |
          nohup ./mvnw spring-boot:run \
            -Dspring-boot.run.profiles=e2e \
            > "$GITHUB_WORKSPACE/backend.log" 2>&1 &

          echo $! > "$GITHUB_WORKSPACE/backend.pid"
          echo "Started backend process with PID $(cat "$GITHUB_WORKSPACE/backend.pid")"

      - name: Wait for backend
        shell: bash
        run: |
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null --max-time 3 -w '%{http_code}' http://localhost:8080/ || true)
            if [ "$code" != "000" ]; then
              echo "Backend is up (HTTP $code) after ~$((i * 2))s"
              exit 0
            fi
            if ! kill -0 "$(cat backend.pid)" 2>/dev/null; then
              echo "::error::Backend process died during startup. Last 100 log lines:"
              tail -n 100 backend.log
              exit 1
            fi
            sleep 2
          done
          echo "::error::Backend did not start within 240s. Last 100 log lines:"
          tail -n 100 backend.log
          exit 1

      - name: Seed the database
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          export E2E_ADMIN_EMAIL="e2e-admin@example.test"
          export E2E_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          export E2E_DOCTOR_EMAIL="e2e-doctor@example.test"
          export E2E_DOCTOR_PASSWORD="$(openssl rand -hex 24)"
          export E2E_ASSISTANT_EMAIL="e2e-assistant@example.test"
          export E2E_ASSISTANT_PASSWORD="$(openssl rand -hex 24)"
          export E2E_PATIENT_EMAIL="e2e-patient@example.test"
          export E2E_PATIENT_PASSWORD="$(openssl rand -hex 24)"
          export E2E_APPOINTMENT_DATE="$(date -u -d '+1 day' +%F)"
          E2E_APPOINTMENT_DAY="$(date -u -d "$E2E_APPOINTMENT_DATE" +%A | tr '[:lower:]' '[:upper:]')"

          {
            echo "E2E_ADMIN_EMAIL=$E2E_ADMIN_EMAIL"
            echo "E2E_ADMIN_PASSWORD=$E2E_ADMIN_PASSWORD"
            echo "E2E_DOCTOR_EMAIL=$E2E_DOCTOR_EMAIL"
            echo "E2E_DOCTOR_PASSWORD=$E2E_DOCTOR_PASSWORD"
            echo "E2E_ASSISTANT_EMAIL=$E2E_ASSISTANT_EMAIL"
            echo "E2E_ASSISTANT_PASSWORD=$E2E_ASSISTANT_PASSWORD"
            echo "E2E_PATIENT_EMAIL=$E2E_PATIENT_EMAIL"
            echo "E2E_PATIENT_PASSWORD=$E2E_PATIENT_PASSWORD"
            echo "E2E_APPOINTMENT_DATE=$E2E_APPOINTMENT_DATE"
          } >> "$GITHUB_ENV"

          psql -h localhost -U postgres -d medapp_e2e_db \
            -v ON_ERROR_STOP=1 \
            -v admin_email="$E2E_ADMIN_EMAIL" \
            -v admin_password="$E2E_ADMIN_PASSWORD" \
            -v doctor_email="$E2E_DOCTOR_EMAIL" \
            -v doctor_password="$E2E_DOCTOR_PASSWORD" \
            -v assistant_email="$E2E_ASSISTANT_EMAIL" \
            -v assistant_password="$E2E_ASSISTANT_PASSWORD" \
            -v patient_email="$E2E_PATIENT_EMAIL" \
            -v patient_password="$E2E_PATIENT_PASSWORD" \
            -v appointment_day="$E2E_APPOINTMENT_DAY" <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;

          INSERT INTO users (id, first_name, last_name, email, password, phone, role)
          VALUES
            (gen_random_uuid(), 'E2E', 'ADMIN', :'admin_email',
             crypt(:'admin_password', gen_salt('bf', 10)), '0611111111', 'ADMIN'),
            (gen_random_uuid(), 'E2E', 'DOCTOR', :'doctor_email',
             crypt(:'doctor_password', gen_salt('bf', 10)), '0611111112', 'DOCTOR'),
            (gen_random_uuid(), 'E2E', 'ASSISTANT', :'assistant_email',
             crypt(:'assistant_password', gen_salt('bf', 10)), '0611111113', 'ASSISTANT'),
            (gen_random_uuid(), 'E2E', 'PATIENT', :'patient_email',
             crypt(:'patient_password', gen_salt('bf', 10)), '0611111114', 'PATIENT');

          INSERT INTO doctors (id, user_id, experience_years, specialty, bio, consultation_duration, active)
          SELECT gen_random_uuid(), id, 5, 'Cardiology',
                 'Doctor seeded for the E2E workflow.', 60, true
          FROM users WHERE email = :'doctor_email';

          INSERT INTO assistant (id, user_id, active)
          SELECT gen_random_uuid(), id, true
          FROM users WHERE email = :'assistant_email';

          INSERT INTO patients (id, user_id)
          SELECT gen_random_uuid(), id
          FROM users WHERE email = :'patient_email';

          INSERT INTO assistant_doctor (assistant_id, doctors_id)
          SELECT a.id, d.id
          FROM assistant a
          JOIN users au ON au.id = a.user_id
          CROSS JOIN doctors d
          JOIN users du ON du.id = d.user_id
          WHERE au.email = :'assistant_email'
            AND du.email = :'doctor_email';

          INSERT INTO doctor_schedules (id, doctor_id, day_of_week, start_time, end_time)
          SELECT gen_random_uuid(), d.id, :'appointment_day', '08:00:00', '18:00:00'
          FROM doctors d
          JOIN users u ON u.id = d.user_id
          WHERE u.email = :'doctor_email';
          SQL

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ vars.YOUR_FRONTEND_DIRECTORY }}/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ vars.YOUR_FRONTEND_DIRECTORY }}
        run: npm ci

      - name: Lint frontend
        working-directory: ${{ vars.YOUR_FRONTEND_DIRECTORY }}
        run: npm run lint

      - name: Build frontend
        working-directory: ${{ vars.YOUR_FRONTEND_DIRECTORY }}
        run: npm run build

      # -------------------------
      # Playwright
      # -------------------------
      # Chromium only for speed. To run all browsers, use
      # `npx playwright install --with-deps`.
      - name: Install Playwright browsers
        working-directory: ${{ vars.YOUR_FRONTEND_DIRECTORY }}
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: ${{ vars.YOUR_FRONTEND_DIRECTORY }}
        run: npx playwright test tests/application.workflow.spec.ts --project=chromium

      - name: Upload Playwright test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-results
          path: ${{ vars.YOUR_FRONTEND_DIRECTORY }}/test-results/
          if-no-files-found: ignore
          retention-days: 14
