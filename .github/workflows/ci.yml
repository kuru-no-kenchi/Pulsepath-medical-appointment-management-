name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

# --------------------------------------------------

# Backend integration tests

# Uses its own PostgreSQL database.

# --------------------------------------------------

  backend-test:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{secrets.YOU_INTEGRATION_TEST_DB_PASSWORD}}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: ${{ vars.YOUR_BACKEND_DIRECTORY }}

    env:
      SPRING_DATASOURCE_URL: ${{ secrets.YOUr_INTEGRATION_TEST_DB_URL }}
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.YOU_INTEGRATION_TEST_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "22"
          cache: maven

      - name: Create integration test database
        working-directory: ${{ vars.YOUR_BACKEND_DIRECTORY }}
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d postgres \
            -c "CREATE DATABASE medapp_test_db;"

      - name: Run backend integration tests
        run: ./mvnw -Dtest=ApplicationWorkFlowIntegrationTest test

# --------------------------------------------------

# Frontend build + Playwright E2E

# Uses a DIFFERENT PostgreSQL database.

# --------------------------------------------------

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_DATASOURCE_URL: ${{ secrets.YOUR_E2E_DB_URL }}
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.YOU_E2E_DB_PASSWORD }}

      NEXT_PUBLIC_API_URL: ${{ secrets.YOUR_E2E_DB_URL }}

      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_DOCTOR_EMAIL: ${{ secrets.E2E_DOCTOR_EMAIL }}
      E2E_DOCTOR_PASSWORD: ${{ secrets.E2E_DOCTOR_PASSWORD }}
      E2E_ASSISTANT_EMAIL: ${{ secrets.E2E_ASSISTANT_EMAIL }}
      E2E_ASSISTANT_PASSWORD: ${{ secrets.E2E_ASSISTANT_PASSWORD }}
      E2E_PATIENT_EMAIL: ${{ secrets.E2E_PATIENT_EMAIL }}
      E2E_PATIENT_PASSWORD: ${{ secrets.E2E_PATIENT_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create E2E database
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d postgres \
            -c "CREATE DATABASE medapp_e2e_db;"
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "22"
          cache: maven

      - name: Start backend Server
        working-directory: ${{ vars.YOUR_BACKEND_DIRECTORY }}
        run: ./mvnw spring-boot:run "-Dspring-boot.run.profiles=e2e" "-Dspring-boot.run.arguments=--spring.datasource.url=jdbc:postgresql://localhost:5332/medapp_e2e" > ../backend.log 2>&1 &

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ vars.YOUR_FRONTEND_DIRECTORY }}/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ vars.YOUR_FRONTEND_DIRECTORY }}
        run: npm ci

      - name: Lint frontend
        working-directory: ${{ vars.YOUR_FRONTEND_DIRECTORY }}
        run: npm run lint

      - name: Build frontend
        working-directory: ${{ vars.YOUR_FRONTEND_DIRECTORY }}
        run: npm run build

      # -------------------------
      # Playwright
      # -------------------------
      - name: Install Playwright browsers
        working-directory: ${{ vars.YOUR_FRONTEND_DIRECTORY }}
        run: npx playwright install --with-deps

      - name: Run Playwright E2E tests
        working-directory: ${{ vars.YOUR_FRONTEND_DIRECTORY }}
        run: npx playwright test

      # -------------------------
      # Artifacts
      # -------------------------
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload Playwright test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-results
          path: ${{ vars.YOUR_FRONTEND_DIRECTORY }}/test-results/
          retention-days: 14

      - name: Upload backend log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: backend-log
          path: ${{ vars.YOUR_BACKEND_DIRECTORY }}/backend.log
          retention-days: 7
