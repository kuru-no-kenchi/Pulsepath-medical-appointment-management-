spring.config.import=optional:file:.env.e2e[.properties]

spring.application.name=${APP_NAME}

spring.datasource.url=${E2E_DB_URL}
spring.datasource.username=${E2E_DB_USERNAME}
spring.datasource.password=${E2E_DB_PASSWORD}


jwt.secret=${E2E_JWT_SECRET}
jwt.expiration=${E2E_JWT_EXPIRATION}
jwt.refresh-expiration=${E2E_JWT_REFRESH_EXPIRATION}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
